[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "evbatt"
version = "0.3.0"
description = "EV battery degradation analysis and uncertainty-aware SOH estimation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Sanjay Mouraly", email = "sanjaymouraly@users.noreply.github.com" }]
keywords = ["lithium-ion", "battery-degradation", "soh", "scientific-benchmark"]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scipy>=1.11,<2",
    "matplotlib>=3.7,<4",
    "pydantic>=2.5,<3",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
app = ["streamlit>=1.36"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5", "openpyxl>=3.1"]

[project.scripts]
evbatt = "evbatt.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/evbatt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]

[project.urls]
Homepage = "https://github.com/sanjaymouraly/ev-battery-degradation-benchmark"
Repository = "https://github.com/sanjaymouraly/ev-battery-degradation-benchmark"
Issues = "https://github.com/sanjaymouraly/ev-battery-degradation-benchmark/issues"

